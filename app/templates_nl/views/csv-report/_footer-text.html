<h2 class="govuk-heading-m">Ons rapport bevat veel gegevens</h2>
<p class="govuk-body">Om dingen de volgende keer te versnellen, kunt u:</p>
<ul class="govuk-list govuk-list--bullet">
  <li>uw gegevensbehoudperiode verminderen op de instellingenpagina</li>
  <li>uw rapporten vaker downloaden</li>
  <li>of de NotifyNL API gebruiken om de status van uw berichten te krijgen</li>
</ul>
