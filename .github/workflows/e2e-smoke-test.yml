name: Cypress Smoke Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to test'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
  workflow_call:
    inputs:
      environment:
        default: 'test'
        required: true
        type: string

env:
  CYPRESS_BASE_URL: ${{ inputs.environment == 'prod' && 'https://admin.notifynl.nl/' || 'https://admin.test.notifynl.nl/' }}

jobs:
  cypress-run:
    name: Smoke test for (${{ inputs.environment }}) environment
    runs-on: ubuntu-24.04
    container:
      # Cypress Docker image from https://hub.docker.com/r/cypress/included
      # with Cypress globally pre-installed
      image: cypress/included:latest
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          spec: cypress/e2e/smoke.cy.js
        env:
          CYPRESS_INSTALL_BINARY: 0
