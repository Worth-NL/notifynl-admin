name: PR

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# No workflow-level concurrency: it would cancel a running helm upgrade in `deploy`.
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.unit-test
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        node-version: ["22"]

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Worth-NL/ci-workflows/.github/actions/python-setup@main
        with:
          python-version: ${{ matrix.python-version }}
          node-version: ${{ matrix.node-version }}

      - name: NPM lint SCSS
        run: npm run lint:scss

      - name: NPM lint JS
        run: npm run lint:js

      - name: Jest tests
        run: npm run test-report

      - uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: JEST Tests
          path: reports/jest-*.xml
          reporter: jest-junit
          only-summary: true
          use-actions-summary: false
          badge-title: JEST

      - uses: Worth-NL/ci-workflows/.github/actions/python-test@main
        with:
          pytest: pytest

  build:
    if: github.event.pull_request.draft == false
    needs: unit-test
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/worth-nl/notifynl-admin

  deploy:
    if: github.event.pull_request.draft == false
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: Worth-NL/ci-workflows/.github/workflows/deploy-test.yml@main
    with:
      tag: ${{ needs.build.outputs.tag }}
      environment-url: https://admin.test.notifynl.nl
      image-keys: |
        apps.admin
    secrets: inherit

  detect-static-changes:
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.detect-static-changes
      cancel-in-progress: true
    if: github.event.pull_request.draft == false
    needs:
      - unit-test
    runs-on: ubuntu-latest
    outputs:
      static_changed: ${{ steps.filter.outputs.static }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            static:
              - 'app/assets/**'

  upload-static:
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.upload-static
      cancel-in-progress: true
    needs: detect-static-changes
    if: github.event.pull_request.draft == false && needs.detect-static-changes.outputs.static_changed == 'true'
    uses: ./.github/workflows/update-static.yml
    with:
      environment: test
    secrets: inherit

  smoke-test:
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.smoke-test
      cancel-in-progress: true
    needs: deploy
    if: github.event.pull_request.draft == false

    # Must match what the called workflow's job requests -- a reusable
    # workflow can only maintain or reduce the caller's permissions, never
    # elevate them, and this workflow's top-level block grants contents: read
    # alone.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    uses: Worth-NL/ci-workflows/.github/workflows/run-smoke-tests.yml@main
    with:
      project: admin
    secrets: inherit
